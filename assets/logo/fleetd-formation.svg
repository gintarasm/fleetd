<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2433"/>
      <stop offset="1" stop-color="#0c1119"/>
    </linearGradient>
    <linearGradient id="lead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- macOS-style squircle-ish tile with standard 100px inset -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- trailing wings of the formation -->
    <g stroke="#94a3b8" stroke-width="44">
      <polyline points="262,218 316,266 262,314" stroke-opacity="0.4"/>
      <polyline points="262,710 316,758 262,806" stroke-opacity="0.4"/>
      <polyline points="390,322 452,376 390,430" stroke-opacity="0.7"/>
      <polyline points="390,594 452,648 390,702" stroke-opacity="0.7"/>
    </g>
    <!-- lead: the prompt -->
    <polyline points="522,428 618,512 522,596" stroke="url(#lead)" stroke-width="58"/>
  </g>
  <!-- cursor -->
  <rect x="652" y="570" width="124" height="44" rx="10" fill="url(#lead)"/>
</svg>
