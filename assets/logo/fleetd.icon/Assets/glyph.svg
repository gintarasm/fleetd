<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- fleetd app icon foreground for macOS 26 (ADR 0104): the glyphs of fleetd-icon.svg, scaled
