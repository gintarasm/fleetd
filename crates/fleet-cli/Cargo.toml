[package]
name = "fleet-cli"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
fleet-client = { version = "0.1.0", path = "../fleet-client" }
fleet-proto = { version = "0.1.0", path = "../fleet-proto" }
fleet-term = { version = "0.1.0", path = "../fleet-term" }
serde_json = "1.0.154"
signal-hook = "0.4.6"

[dev-dependencies]
libc = "0.2.191"
portable-pty = "0.9.0"
tempfile = "3.27.0"
tokio-util = { version = "0.7.20", features = ["codec"] }
