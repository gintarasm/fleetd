[package]
name = "fleetd"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
fleet-client = { version = "0.1.0", path = "../fleet-client" }
fleet-node = { version = "0.1.0", path = "../fleet-node" }
fleet-proto = { version = "0.1.0", path = "../fleet-proto" }
fs4 = "1.1.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
libc = "0.2.191"
prost = "0.14.6"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "macros", "time", "sync"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }

[dev-dependencies]
libc = "0.2.191"
rusqlite = { version = "0.42.0", features = ["bundled"] }
tempfile = "3.27.0"
