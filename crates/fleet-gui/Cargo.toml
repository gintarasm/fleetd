[package]
name = "fleet-gui"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[lib]
name = "fleet_gui"
path = "src/lib.rs"

[[bin]]
name = "fleet-gui"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fleet-client = { version = "0.1.0", path = "../fleet-client" }
fleet-term = { version = "0.1.0", path = "../fleet-term" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.1"
toml_edit = "0.25.19"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = "=0.2.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[dev-dependencies]
fleet-proto = { path = "../fleet-proto" }
tempfile = "3.27.0"
