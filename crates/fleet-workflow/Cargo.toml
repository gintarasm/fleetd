[package]
name = "fleet-workflow"
version = "0.1.0"
edition = "2024"
description = "Workflows behind fleetd's RunAction: the Workflow and Host traits, manifests, capabilities and parameter validation (ADR 0092)"

[lints]
workspace = true

[dependencies]
fleet-proto = { version = "0.1.0", path = "../fleet-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
