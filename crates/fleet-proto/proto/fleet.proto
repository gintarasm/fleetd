syntax = "proto3";
package fleet.v1;

message Hello { uint32 protocol_version = 1; string client = 2; }
message HelloOk {
  uint32 protocol_version = 1;
  string server = 2;
  // A random token drawn on every daemon process start (a restart too), so
  // a client can tell the daemon was replaced. Not a counter: values are
  // only compared for equality.
  uint64 instance = 3;
  // The binary the daemon is running from.
  BinaryIdentity binary = 4;
  // What the daemon recovered at startup (unset when nothing was restored).
  RestoreSummary restore = 5;
}

message BinaryIdentity {
  string path = 1;
  uint64 dev = 2;
  uint64 ino = 3;
  uint64 size = 4;
  int64 mtime_ns = 5;
}

// `restart_error` is set (and `previous_instance` is 0) when a restart was
// attempted and the daemon thawed instead.
message RestoreSummary {
  uint64 previous_instance = 1;
  repeated uint64 kept = 2;
  repeated uint64 failed = 3;
  bool fell_back = 4;
  string restart_error = 5;
}

message RestartDaemon { string binary = 1; }
message RestartingDaemon { uint32 agents = 1; }
message HandshakeReject { string reason = 1; }

message Request {
  uint64 id = 1;
  oneof kind {
    SpawnAgent spawn = 2;
    ListAgents list = 3;
    Attach attach = 4;
    Detach detach = 5;
    SendInput input = 6;
    Resize resize = 7;
    KillAgent kill = 8;
    ReadHistory read_history = 9;
    SetLabels set_labels = 10;
    ReadLogs read_logs = 11;
    StopLogs stop_logs = 12;
    RestartAgent restart = 13;
    ForgetAgents forget = 14;
    RestartDaemon restart_daemon = 15;
  }
}

message Response {
  uint64 id = 1;
  oneof kind {
    AgentInfo spawned = 2;
    AgentList agents = 3;
    AttachOk attached = 4;
    Ack ack = 5;
    Error error = 6;
    HistoryPage history = 7;
    SpawnedAttached spawned_attached = 8;
    LogLines log_lines = 9;
    Restarted restarted = 10;
    Forgotten forgotten = 11;
    RestartingDaemon restarting_daemon = 12;
  }
}

message Event {
  oneof kind {
    AgentExited exited = 1;
    Lagged lagged = 2;
    AgentActivity activity = 3;
    AttachRole role = 4;
    LogLine log_line = 5;
    AgentResized agent_resized = 6;
    AgentRemoved agent_removed = 7;
  }
}

message SpawnAgent {
  string program = 1;
  repeated string args = 2;
  string cwd = 3;
  map<string, string> env = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  // Attach in the same request: the reply is `SpawnedAttached`, and the
  // subscription exists before the process starts.
  bool attach = 7;
  // Labels (ADR 0025): at most 64, keys 1-64 bytes, values up to 256 bytes;
  // keys starting with `fleet.` are reserved.
  map<string, string> labels = 8;
}

// Only agents whose labels contain every selector pair; empty means all.
message ListAgents { map<string, string> selector = 1; }

// AgentList gains the durable restart record, so a client that missed
// AgentRemoved can still follow a restart: old id -> its newest successor
// (chains are collapsed on write, so one lookup suffices).
message AgentList { repeated AgentInfo agents = 1; map<uint64, uint64> replaced = 2; }

// Restart an exited or lost agent: same program, args, cwd and labels, new
// id. The old agent is forgotten once the new one has started. `cols`,
// `rows` and `attach` mean what they mean in SpawnAgent.
message RestartAgent { uint64 agent_id = 1; uint32 cols = 2; uint32 rows = 3; bool attach = 4; }
// `attached` is set when `attach` was.
message Restarted { uint64 old_id = 1; AgentInfo agent = 2; optional AttachOk attached = 3; }

// Forget exited or lost agents: their list entries, final screens,
// history and scrollback rings are deleted. `exited_only` = every exited or
// lost agent whose labels contain every `selector` pair (empty selector:
// all of them); `ids` must then be empty. Running agents are never touched.
message ForgetAgents { repeated uint64 ids = 1; bool exited_only = 2; map<string, string> selector = 3; }
// `refused`: ids that are running or unknown, with nothing done to them.
message Forgotten { repeated uint64 ids = 1; repeated uint64 refused = 2; }

// Pushed to every connection when an agent is forgotten, after the
// request that did it is answered. `replaced_by` is set by a restart.
message AgentRemoved { uint64 agent_id = 1; optional uint64 replaced_by = 2; }

enum AgentState {
  AGENT_STATE_UNSPECIFIED = 0;
  RUNNING = 1;
  EXITED = 2;
  LOST = 3;
}

message AgentInfo {
  uint64 id = 1;
  string program = 2;
  repeated string args = 3;
  string cwd = 4;
  AgentState state = 5;
  optional int32 exit_code = 6;
  int64 created_unix_ms = 7;
  map<string, string> labels = 8;
  // When an exited agent exited (ADR 0058); unset while running, for a lost
  // agent, and for an exit recorded by a node before it stored the time.
  optional int64 exited_unix_ms = 9;
}

// With `observe`, a read-only attach (ADR 0022): it never takes or changes
// the primary role (`AttachOk.primary` is false, no `AttachRole` events), and
// its input does not promote it. Observers must not answer terminal queries.
message Attach { uint64 agent_id = 1; bool observe = 2; }
message AttachOk {
  uint64 agent_id = 1;
  bytes snapshot = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  // The in-memory history tail: lines that scrolled off above the snapshot,
  // oldest first; `history_tail[0]` is line `tail_first_line`.
  repeated bytes history_tail = 5;
  uint64 tail_first_line = 6;
  // The oldest line still in history, and the generation (bumped by CSI 3 J).
  uint64 history_first_line = 7;
  uint64 history_generation = 8;
  // Whether this client's resizes apply to the agent.
  bool primary = 9;
}
message SendInput { uint64 agent_id = 1; bytes data = 2; }
message Resize { uint64 agent_id = 1; uint32 cols = 2; uint32 rows = 3; }
message KillAgent { uint64 agent_id = 1; }
message Detach { uint64 agent_id = 1; }
message AgentExited { uint64 agent_id = 1; int32 exit_code = 2; }
message Error { string message = 1; }

// A page of history: the lines immediately before `before_line`, at most
// `max_lines` (capped by the server). A stale `generation` is an error.
message ReadHistory {
  uint64 agent_id = 1;
  uint64 generation = 2;
  uint64 before_line = 3;
  uint32 max_lines = 4;
}
// `lines[0]` is line `first_line`.
message HistoryPage { uint64 agent_id = 1; uint64 first_line = 2; repeated bytes lines = 3; }
message SpawnedAttached { AgentInfo agent = 1; AttachOk attached = 2; }
// Applies `set`, then `remove`; answered by `Ack`.
message SetLabels {
  uint64 agent_id = 1;
  map<string, string> set = 2;
  repeated string remove = 3;
}
// The connection's subscription to the agent was dropped (it fell behind);
// re-attach to resume.
message Lagged { uint64 agent_id = 1; }
message AgentActivity { uint64 agent_id = 1; string last_line = 2; int64 last_output_unix_ms = 3; }
message AttachRole { uint64 agent_id = 1; bool primary = 2; }
// The agent's grid was resized; arrives in the agent's stream, in order with
// its output, on every subscription (primary or not).
message AgentResized { uint64 agent_id = 1; uint32 cols = 2; uint32 rows = 3; }
message Ack {}

// The daemon's log (ADR 0027): the last `tail` lines (capped at 10 000) of
// `fleetd.log.2`, `.1` and `fleetd.log`, oldest first, answered by
// `LogLines` (at most 8 MiB of lines: the oldest are dropped; a line is at
// most 4 KiB, longer ones are cut and end in " …[truncated]"). With `follow`, each new line then arrives as `LogLine` until
// `StopLogs` (answered by `Ack`) or disconnect; a follower that falls behind
// gets a `LogLine` "… N lines dropped" and stays connected.
message ReadLogs { uint32 tail = 1; bool follow = 2; }
message StopLogs {}
message LogLines { repeated string lines = 1; }
message LogLine { string line = 1; }
