syntax = "proto3";
package fleet.v1;

message Hello { uint32 protocol_version = 1; string client = 2; }
message HelloOk { uint32 protocol_version = 1; string server = 2; }
message HandshakeReject { string reason = 1; }

message Request {
  uint64 id = 1;
  oneof kind {
    SpawnAgent spawn = 2;
    ListAgents list = 3;
    Attach attach = 4;
    Detach detach = 5;
    SendInput input = 6;
    Resize resize = 7;
    KillAgent kill = 8;
    ReadHistory read_history = 9;
    SetLabels set_labels = 10;
  }
}

message Response {
  uint64 id = 1;
  oneof kind {
    AgentInfo spawned = 2;
    AgentList agents = 3;
    AttachOk attached = 4;
    Ack ack = 5;
    Error error = 6;
    HistoryPage history = 7;
    SpawnedAttached spawned_attached = 8;
  }
}

message Event {
  oneof kind {
    AgentExited exited = 1;
    Lagged lagged = 2;
    AgentActivity activity = 3;
    AttachRole role = 4;
  }
}

message SpawnAgent {
  string program = 1;
  repeated string args = 2;
  string cwd = 3;
  map<string, string> env = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  // Attach in the same request: the reply is `SpawnedAttached`, and the
  // subscription exists before the process starts.
  bool attach = 7;
  // Labels (ADR 0025): at most 64, keys 1-64 bytes, values up to 256 bytes;
  // keys starting with `fleet.` are reserved.
  map<string, string> labels = 8;
}

// Only agents whose labels contain every selector pair; empty means all.
message ListAgents { map<string, string> selector = 1; }

message AgentList { repeated AgentInfo agents = 1; }

enum AgentState {
  AGENT_STATE_UNSPECIFIED = 0;
  RUNNING = 1;
  EXITED = 2;
  LOST = 3;
}

message AgentInfo {
  uint64 id = 1;
  string program = 2;
  repeated string args = 3;
  string cwd = 4;
  AgentState state = 5;
  optional int32 exit_code = 6;
  int64 created_unix_ms = 7;
  map<string, string> labels = 8;
}

message Attach { uint64 agent_id = 1; }
message AttachOk {
  uint64 agent_id = 1;
  bytes snapshot = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  // The in-memory history tail: lines that scrolled off above the snapshot,
  // oldest first; `history_tail[0]` is line `tail_first_line`.
  repeated bytes history_tail = 5;
  uint64 tail_first_line = 6;
  // The oldest line still in history, and the generation (bumped by CSI 3 J).
  uint64 history_first_line = 7;
  uint64 history_generation = 8;
  // Whether this client's resizes apply to the agent.
  bool primary = 9;
}
message SendInput { uint64 agent_id = 1; bytes data = 2; }
message Resize { uint64 agent_id = 1; uint32 cols = 2; uint32 rows = 3; }
message KillAgent { uint64 agent_id = 1; }
message Detach { uint64 agent_id = 1; }
message AgentExited { uint64 agent_id = 1; int32 exit_code = 2; }
message Error { string message = 1; }

// A page of history: the lines immediately before `before_line`, at most
// `max_lines` (capped by the server). A stale `generation` is an error.
message ReadHistory {
  uint64 agent_id = 1;
  uint64 generation = 2;
  uint64 before_line = 3;
  uint32 max_lines = 4;
}
// `lines[0]` is line `first_line`.
message HistoryPage { uint64 agent_id = 1; uint64 first_line = 2; repeated bytes lines = 3; }
message SpawnedAttached { AgentInfo agent = 1; AttachOk attached = 2; }
// Applies `set`, then `remove`; answered by `Ack`.
message SetLabels {
  uint64 agent_id = 1;
  map<string, string> set = 2;
  repeated string remove = 3;
}
// The connection's subscription to the agent was dropped (it fell behind);
// re-attach to resume.
message Lagged { uint64 agent_id = 1; }
message AgentActivity { uint64 agent_id = 1; string last_line = 2; int64 last_output_unix_ms = 3; }
message AttachRole { uint64 agent_id = 1; bool primary = 2; }
message Ack {}
