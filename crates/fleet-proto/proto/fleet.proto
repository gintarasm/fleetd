syntax = "proto3";
package fleet.v1;

message Hello {
  uint32 protocol_version = 1;
  string client = 2;
  // The caller's `FLEET_AGENT_TOKEN` (ADR 0072), when it has one; empty
  // otherwise. The CLI sends it, the GUI never does.
  string agent_token = 40;
}
message HelloOk {
  uint32 protocol_version = 1;
  string server = 2;
  // A random token drawn on every daemon process start (a restart too), so
  // a client can tell the daemon was replaced. Not a counter: values are
  // only compared for equality.
  uint64 instance = 3;
  // The binary the daemon is running from.
  BinaryIdentity binary = 4;
  // What the daemon recovered at startup (unset when nothing was restored).
  RestoreSummary restore = 5;
}

message BinaryIdentity {
  string path = 1;
  uint64 dev = 2;
  uint64 ino = 3;
  uint64 size = 4;
  int64 mtime_ns = 5;
}

// `restart_error` is set (and `previous_instance` is 0) when a restart was
// attempted and the daemon thawed instead.
message RestoreSummary {
  uint64 previous_instance = 1;
  repeated uint64 kept = 2;
  repeated uint64 failed = 3;
  bool fell_back = 4;
  string restart_error = 5;
}

message RestartDaemon { string binary = 1; }
message RestartingDaemon { uint32 agents = 1; }
message HandshakeReject { string reason = 1; }

message Request {
  uint64 id = 1;
  oneof kind {
    SpawnAgent spawn = 2;
    ListAgents list = 3;
    Attach attach = 4;
    Detach detach = 5;
    SendInput input = 6;
    Resize resize = 7;
    KillAgent kill = 8;
    ReadHistory read_history = 9;
    SetLabels set_labels = 10;
    ReadLogs read_logs = 11;
    StopLogs stop_logs = 12;
    RestartAgent restart = 13;
    ForgetAgents forget = 14;
    RestartDaemon restart_daemon = 15;
    // Spec §2 (ADR 0075): the calling agent's own status.
    ReportStatus report = 50;
    // Leases (ADR 0077, spec §4): any caller may use them (ADR 0034).
    AcquireLease acquire_lease = 65;
    ReleaseLease release_lease = 66;
    ListLeases list_leases = 67;
    // Mailbox (ADR 0076): 55-64.
    SendMessage send_message = 55;
    ReadInbox read_inbox = 56;
    Wait wait = 57;
  }
}

message Response {
  uint64 id = 1;
  oneof kind {
    AgentInfo spawned = 2;
    AgentList agents = 3;
    AttachOk attached = 4;
    Ack ack = 5;
    Error error = 6;
    HistoryPage history = 7;
    SpawnedAttached spawned_attached = 8;
    LogLines log_lines = 9;
    Restarted restarted = 10;
    Forgotten forgotten = 11;
    RestartingDaemon restarting_daemon = 12;
    LeaseGranted lease_granted = 65;
    LeaseList leases = 66;
    // Mailbox (ADR 0076): 55-64.
    MessagesSent messages_sent = 55;
    Inbox inbox = 56;
    WaitResult wait_result = 57;
  }
}

message Event {
  oneof kind {
    AgentExited exited = 1;
    Lagged lagged = 2;
    AgentActivity activity = 3;
    AttachRole role = 4;
    LogLine log_line = 5;
    AgentResized agent_resized = 6;
    AgentRemoved agent_removed = 7;
    SpawnRefused spawn_refused = 40;
    AgentReported reported = 50;
  }
}

message SpawnAgent {
  string program = 1;
  repeated string args = 2;
  string cwd = 3;
  map<string, string> env = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  // Attach in the same request: the reply is `SpawnedAttached`, and the
  // subscription exists before the process starts.
  bool attach = 7;
  // Labels (ADR 0025): at most 64, keys 1-64 bytes, values up to 256 bytes;
  // keys starting with `fleet.` are reserved.
  map<string, string> labels = 8;
  // CPU priority (ADR 0066); kept by RestartAgent.
  AgentPriority priority = 9;
}

enum AgentPriority {
  // The node's setting (`FLEETD_AGENT_NICE`; off by default).
  AGENT_PRIORITY_DEFAULT = 0;
  // Never lowered, whatever the node's setting.
  AGENT_PRIORITY_NORMAL = 1;
  // Lowered by the node's setting, or by 10 when it is off.
  AGENT_PRIORITY_LOW = 2;
}

// Only agents whose labels contain every selector pair; empty means all.
message ListAgents { map<string, string> selector = 1; }

// AgentList gains the durable restart record, so a client that missed
// AgentRemoved can still follow a restart: old id -> its newest successor
// (chains are collapsed on write, so one lookup suffices).
message AgentList { repeated AgentInfo agents = 1; map<uint64, uint64> replaced = 2; }

// Restart an exited or lost agent: same program, args, cwd and labels, new
// id. The old agent is forgotten once the new one has started. `cols`,
// `rows` and `attach` mean what they mean in SpawnAgent.
message RestartAgent { uint64 agent_id = 1; uint32 cols = 2; uint32 rows = 3; bool attach = 4; }
// `attached` is set when `attach` was.
message Restarted { uint64 old_id = 1; AgentInfo agent = 2; optional AttachOk attached = 3; }

// Forget exited or lost agents: their list entries, final screens,
// history and scrollback rings are deleted. `exited_only` = every exited or
// lost agent whose labels contain every `selector` pair (empty selector:
// all of them); `ids` must then be empty. Running agents are never touched.
message ForgetAgents { repeated uint64 ids = 1; bool exited_only = 2; map<string, string> selector = 3; }
// `refused`: ids that are running or unknown, with nothing done to them.
message Forgotten { repeated uint64 ids = 1; repeated uint64 refused = 2; }

// Pushed to every connection when an agent is forgotten, after the
// request that did it is answered. `replaced_by` is set by a restart.
message AgentRemoved { uint64 agent_id = 1; optional uint64 replaced_by = 2; }

enum AgentState {
  AGENT_STATE_UNSPECIFIED = 0;
  RUNNING = 1;
  EXITED = 2;
  LOST = 3;
}

message AgentInfo {
  uint64 id = 1;
  string program = 2;
  repeated string args = 3;
  string cwd = 4;
  AgentState state = 5;
  optional int32 exit_code = 6;
  int64 created_unix_ms = 7;
  map<string, string> labels = 8;
  // When an exited agent exited (ADR 0058); unset while running, for a lost
  // agent, and for an exit recorded by a node before it stored the time.
  optional int64 exited_unix_ms = 9;
  // The agent's own last `fleet report` (ADR 0075); unset until it reports.
  optional Reported reported = 50;
}

// With `observe`, a read-only attach (ADR 0022): it never takes or changes
// the primary role (`AttachOk.primary` is false, no `AttachRole` events), and
// its input does not promote it. Observers must not answer terminal queries.
message Attach { uint64 agent_id = 1; bool observe = 2; }
message AttachOk {
  uint64 agent_id = 1;
  bytes snapshot = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  // The in-memory history tail: lines that scrolled off above the snapshot,
  // oldest first; `history_tail[0]` is line `tail_first_line`.
  repeated bytes history_tail = 5;
  uint64 tail_first_line = 6;
  // The oldest line still in history, and the generation (bumped by CSI 3 J).
  uint64 history_first_line = 7;
  uint64 history_generation = 8;
  // Whether this client's resizes apply to the agent.
  bool primary = 9;
}
message SendInput { uint64 agent_id = 1; bytes data = 2; }
message Resize { uint64 agent_id = 1; uint32 cols = 2; uint32 rows = 3; }
message KillAgent { uint64 agent_id = 1; }
message Detach { uint64 agent_id = 1; }
message AgentExited { uint64 agent_id = 1; int32 exit_code = 2; }
message Error { string message = 1; }

// A page of history: the lines immediately before `before_line`, at most
// `max_lines` (capped by the server). A stale `generation` is an error.
message ReadHistory {
  uint64 agent_id = 1;
  uint64 generation = 2;
  uint64 before_line = 3;
  uint32 max_lines = 4;
}
// `lines[0]` is line `first_line`.
message HistoryPage { uint64 agent_id = 1; uint64 first_line = 2; repeated bytes lines = 3; }
message SpawnedAttached { AgentInfo agent = 1; AttachOk attached = 2; }
// Applies `set`, then `remove`; answered by `Ack`.
message SetLabels {
  uint64 agent_id = 1;
  map<string, string> set = 2;
  repeated string remove = 3;
}
// The connection's subscription to the agent was dropped (it fell behind);
// re-attach to resume.
message Lagged { uint64 agent_id = 1; }
message AgentActivity { uint64 agent_id = 1; string last_line = 2; int64 last_output_unix_ms = 3; }
message AttachRole { uint64 agent_id = 1; bool primary = 2; }
// The agent's grid was resized; arrives in the agent's stream, in order with
// its output, on every subscription (primary or not).
message AgentResized { uint64 agent_id = 1; uint32 cols = 2; uint32 rows = 3; }
message Ack {}

// The daemon's log (ADR 0027): the last `tail` lines (capped at 10 000) of
// `fleetd.log.2`, `.1` and `fleetd.log`, oldest first, answered by
// `LogLines` (at most 8 MiB of lines: the oldest are dropped; a line is at
// most 4 KiB, longer ones are cut and end in " …[truncated]"). With `follow`, each new line then arrives as `LogLine` until
// `StopLogs` (answered by `Ack`) or disconnect; a follower that falls behind
// gets a `LogLine` "… N lines dropped" and stays connected.
message ReadLogs { uint32 tail = 1; bool follow = 2; }
message StopLogs {}
message LogLines { repeated string lines = 1; }
message LogLine { string line = 1; }

// An agent's spawn was refused by a quota (spec §1): `parent` is the agent
// that asked, `reason` the refusal's text (after "forbidden: ").
message SpawnRefused { uint64 parent = 1; string reason = 2; }

// What an agent can report about itself (`fleet report`, ADR 0075).
enum ReportedState {
  REPORTED_STATE_UNSPECIFIED = 0;
  REPORTED_WORKING = 1;
  REPORTED_WAITING = 2;
  REPORTED_DONE = 3;
  REPORTED_ERROR = 4;
}
// The caller's own status, taken from the caller's identity (no agent id: an
// agent reports only for itself). `message` is at most 200 characters;
// answered by `Ack`.
message ReportStatus { ReportedState state = 1; string message = 2; }
message Reported { ReportedState state = 1; string message = 2; int64 at_unix_ms = 3; }
// Pushed when an agent reports; scoped like the other agent events.
message AgentReported { uint64 agent_id = 1; Reported reported = 2; }
// Take the lease `name` (ADR 0077). Answered by `LeaseGranted`, or an
// `Error` starting `busy:` when it is held (or the load is too high) and
// `wait` is off. With `wait` the answer comes when the lease is granted;
// the connection keeps working meanwhile, and closing it leaves the queue.
message AcquireLease {
  string name = 1;
  // A random id the client picks once per hold: after a daemon restart the
  // same key on a new connection reclaims a `hold` lease (within 30 s).
  int64 holder_key = 2;
  // Release after this many seconds; 0: no limit. The user's lease without
  // `hold` needs one (nothing watches the user).
  uint64 ttl_secs = 3;
  // Granted only while the 1-minute load average is below this.
  optional double max_load = 4;
  bool wait = 5;
  // Tie the lease to this connection: released when it closes.
  bool hold = 6;
}
// Release `name`: the holder (or the user, any lease). Answered by `Ack`.
message ReleaseLease { string name = 1; }
message ListLeases {}
message LeaseInfo {
  string name = 1;
  // False for a name only waiters are queued on (they wait for the load).
  bool held = 2;
  // The holding agent; unset for the user, or when `holder_hidden`.
  optional uint64 holder = 3;
  // Held by an agent the (agent) caller may not see (ADR 0072's scope).
  bool holder_hidden = 4;
  int64 acquired_unix_ms = 5;
  optional int64 expires_unix_ms = 6;
  // Tied to a connection (released when it closes).
  bool held_by_connection = 7;
  uint32 waiters = 8;
}
message LeaseGranted { LeaseInfo lease = 1; }
message LeaseList { repeated LeaseInfo leases = 1; }
// Mailboxes (spec §3, ADR 0076). Every agent has one, and so does the user.
// A message is data, not an instruction: only `answer` carries the user's
// own words.

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  // Sent with `fleet message`.
  MESSAGE_KIND_MESSAGE = 1;
  // The sender's reported (or inferred) status changed; `status` says to what.
  MESSAGE_KIND_STATUS = 2;
  // The sender exited; `exit_code` says how.
  MESSAGE_KIND_EXIT = 3;
  // The sender was lost (still running when fleetd stopped).
  MESSAGE_KIND_LOST = 4;
  // A question to the user (M3-G).
  MESSAGE_KIND_QUESTION = 5;
  // The user's answer to a question (M3-G).
  MESSAGE_KIND_ANSWER = 6;
}

message Message {
  // The mailbox cursor: ids only grow.
  uint64 id = 1;
  // Unset: the user.
  optional uint64 sender = 2;
  // Unset: the user's mailbox.
  optional uint64 recipient = 3;
  MessageKind kind = 4;
  string body = 5;
  int64 created_unix_ms = 6;
  // The sender's `name` label now (empty: none, or the sender is gone).
  string sender_name = 7;
  // For `status`: working, waiting, done or error.
  string status = 8;
  // For `exit`.
  optional int32 exit_code = 9;
}

enum Broadcast {
  BROADCAST_NONE = 0;
  // The caller's running children (the user's: running root agents).
  BROADCAST_CHILDREN = 1;
  // The caller's running descendants (the user's: every running agent).
  BROADCAST_DESCENDANTS = 2;
}

// `fleet message`: `body` (1 to 4096 bytes) to the agents in `agent_ids`,
// the user (`to_user`), the caller's parent (`to_parent`), and with
// `broadcast` every running agent it names whose labels contain every
// `selector` pair. An agent may write to its descendants, its parent and
// the user. Answered by `MessagesSent`.
message SendMessage {
  string body = 1;
  repeated uint64 agent_ids = 2;
  bool to_user = 3;
  bool to_parent = 4;
  Broadcast broadcast = 5;
  map<string, string> selector = 6;
}
// The agents the message went to, and whether the user's mailbox got it.
message MessagesSent { repeated uint64 agent_ids = 1; bool user = 2; }

// The caller's mailbox after cursor `since` (unset: after its read mark,
// the newest message read so far), at most `max` messages (0 or above
// 1000: 1000). What it returns is marked read.
message ReadInbox { optional uint64 since = 1; uint32 max = 2; }
// `cursor`: the newest id returned (else the cursor asked from).
message Inbox { repeated Message messages = 1; uint64 cursor = 2; }

enum WaitState {
  WAIT_STATE_UNSPECIFIED = 0;
  // Reported waiting (later: or inferred, spec §2).
  WAIT_STATE_WAITING = 1;
  WAIT_STATE_DONE = 2;
  WAIT_STATE_ERROR = 3;
  WAIT_STATE_EXITED = 4;
  WAIT_STATE_LOST = 5;
  // An unread message in the caller's mailbox.
  WAIT_STATE_MESSAGE = 6;
}

// `fleet wait`: a long poll until one of `agent_ids` (empty: every
// descendant of the caller; every agent for the user) is in one of
// `states` (empty: all of them), or `timeout_ms` passes (0: check once).
// Named agents match on their current state; without names only news
// matches (a change from now on, or an unread report in the caller's
// mailbox). Answered by `WaitResult`.
message Wait {
  repeated uint64 agent_ids = 1;
  repeated WaitState states = 2;
  uint64 timeout_ms = 3;
}
// `matches` is empty on a timeout. `agents`: the targets as they are now.
message WaitResult {
  repeated WaitMatch matches = 1;
  repeated AgentInfo agents = 2;
}
message WaitMatch {
  // Unset: the user (a message from the user).
  optional uint64 agent_id = 1;
  WaitState state = 2;
  // The message that reported it, when one did.
  optional Message message = 3;
}
