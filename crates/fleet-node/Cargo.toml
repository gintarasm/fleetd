[package]
name = "fleet-node"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
bytes = "1.12.1"
libc = "0.2.191"
portable-pty = "0.9.0"
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
libc = "0.2.191"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "time"] }
