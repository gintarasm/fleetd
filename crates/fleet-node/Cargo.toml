[package]
name = "fleet-node"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
fleet-proto = { version = "0.1.0", path = "../fleet-proto" }
fleet-term = { version = "0.1.0", path = "../fleet-term" }
libc = "0.2.191"
portable-pty = "0.9.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
libc = "0.2.191"
prost = "0.14.6"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "time"] }
