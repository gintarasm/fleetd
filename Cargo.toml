[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.lints.clippy]
all = "warn"

# `Terminal::feed` renders every row that scrolls off as ANSI history; unoptimised
# it is ~20x slower, too slow for the daemon tests that flood a PTY (e.g.
# `stalled_terminal_gets_lagged_exit_2` needs the subscriber to lag within 3 s).
[profile.dev.package.fleet-term]
opt-level = 2

# Whole-program optimisation: cuts `fleetd`'s resident `__TEXT` and so its idle
# RSS (issue #19, ADR 0040). `panic` stays `unwind`: the restart handoff relies on
# `catch_unwind` (`crates/fleetd/src/restart.rs`).
[profile.release]
lto = "fat"
codegen-units = 1
